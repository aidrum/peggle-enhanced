# Android APKs of both editions (arm, arm64, x64). Only the signed APK is published: the build also
# leaves an unsigned "<package>.apk" next to "<package>-Signed.apk", which Android refuses to install.
#
# Signing: without secrets each run signs with a fresh debug key, so a new build won't install over
# the previous one (uninstalling first deletes the saves in Android/data/<package>/files). For
# updates that install in place, add these repository secrets (Settings > Secrets and variables >
# Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of a keystore made with e.g.
#                              keytool -genkeypair -keystore peggle.keystore -alias peggle -keyalg RSA -keysize 2048 -validity 10000
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key alias (peggle above)
#   ANDROID_KEY_PASSWORD       the key password (the store password if you didn't set one)
name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths-ignore: ['**.md', 'distribution/*.bat', 'Peggle.iOS/**', 'Peggle.Desktop/**']
    branches: ['**']
  pull_request:
    paths-ignore: ['**.md', 'distribution/*.bat', 'Peggle.iOS/**', 'Peggle.Desktop/**']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: APK (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: HD
            package: com.aidrum.peggle.hd
            apk: PeggleHD-android.apk
          - edition: iPhone
            package: com.aidrum.peggle
            apk: Peggle-android.apk
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android workload and SDK packages
        run: |
          # A private SDK folder (the runner's preinstalled one may not be writable or have API 36).
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          dotnet workload install android
          dotnet build Peggle.Android -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Set up the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/peggle.keystore"
            echo "args=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/peggle.keystore -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "Signing with the repository's keystore."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key (see the top of android.yml)."
          fi
      - name: Build (Release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: >
          dotnet build Peggle.Android -c Release
          -p:PeggleEdition=${{ matrix.edition }}
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME"
          ${{ steps.key.outputs.args }}

      - name: Pick the signed APK and verify it
        run: |
          set -euo pipefail
          SIGNED="$(find Peggle.Android/bin -name '${{ matrix.package }}-Signed.apk' | head -n1)"
          if [ -z "$SIGNED" ]; then echo "No signed APK found" >&2; exit 1; fi
          cp "$SIGNED" "${{ matrix.apk }}"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose --print-certs "${{ matrix.apk }}" | grep -E "Verifie|SHA-256 digest|certificate DN"
          # Android 15+ devices with 16 KB pages need the uncompressed native libraries 16 KB aligned.
          "$BT/zipalign" -c -P 16 4 "${{ matrix.apk }}" > /dev/null && echo "zipalign (16 KB pages): OK"
          ls -lh "${{ matrix.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}
          compression-level: 0
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.apk }}
