# macOS .app builds (DesktopGL) of both editions, for Intel (osx-x64) and Apple Silicon (osx-arm64).
# Ad-hoc signed only: on first launch right-click the app > Open (or run
# `xattr -dr com.apple.quarantine "Peggle HD.app"`) to get past Gatekeeper.
name: macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths-ignore: ['**.md', 'distribution/*.bat', 'Peggle.Android/**', 'Peggle.iOS/**']
    branches: ['**']
  pull_request:
    paths-ignore: ['**.md', 'distribution/*.bat', 'Peggle.Android/**', 'Peggle.iOS/**']

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  app:
    name: App (${{ matrix.edition }}, ${{ matrix.rid }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [HD, iPhone]
        rid: [osx-x64, osx-arm64]
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .app
        run: distribution/build_macos.sh ${{ matrix.edition }} ${{ matrix.rid }}

      - name: Find zip
        id: zip
        run: echo "path=$(ls distribution/out/*.zip | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Peggle${{ matrix.edition == 'HD' && 'HD' || '' }}-macOS-${{ matrix.rid }}
          path: ${{ steps.zip.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ steps.zip.outputs.path }}
