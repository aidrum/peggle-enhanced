# Unsigned iOS/iPadOS builds (.ipa) of both editions. Install them with a tool that signs on install:
# Sideloadly, AltStore / SideStore (free Apple ID) or TrollStore. Run it from the Actions tab
# ("Run workflow"), or let it run on pushes / pull requests that touch the game.
name: iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths-ignore: ['**.md', 'distribution/*.bat', 'Peggle.Android/**']
    branches: ['**']
  pull_request:
    paths-ignore: ['**.md', 'distribution/*.bat', 'Peggle.Android/**']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    name: IPA (${{ matrix.edition }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: HD
            ipa: PeggleHD
          - edition: iPhone
            ipa: Peggle
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      # The .NET iOS workload needs a matching (recent) Xcode; use the newest stable one on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the iOS workload
        run: dotnet workload install ios

      - name: Build (Release, ios-arm64, no code signing)
        run: >
          dotnet build Peggle.iOS/Peggle.iOS.csproj
          -c Release -r ios-arm64
          -p:PeggleEdition=${{ matrix.edition }}
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:BuildIpa=false
          -p:ValidateXcodeVersion=false

      - name: Package Payload/*.app into an unsigned .ipa
        run: |
          set -euo pipefail
          APP="$(find Peggle.iOS/bin -type d -name '*.app' -path '*Release*ios-arm64*' | head -n1)"
          if [ -z "$APP" ]; then echo "No .app found under Peggle.iOS/bin" >&2; exit 1; fi
          echo "App bundle: $APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          # Strip any leftover signature so sideloading tools sign from a clean slate.
          rm -rf ipa/Payload/*.app/_CodeSignature ipa/Payload/*.app/embedded.mobileprovision
          (cd ipa && zip -qry "../${{ matrix.ipa }}-unsigned.ipa" Payload)
          ls -lh "${{ matrix.ipa }}-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ipa }}-iOS-unsigned
          path: ${{ matrix.ipa }}-unsigned.ipa
          # An .ipa is already a zip.
          compression-level: 0
          if-no-files-found: error

      # Pushing a v* tag also attaches the IPAs to that tag's GitHub release.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.ipa }}-unsigned.ipa
