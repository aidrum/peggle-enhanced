// Peggle World of Warcraft (PC) levels, shown on their own Quick Play page after Extreme, and
// played as their own Adventure (Select Game > More). They play as Nights levels. Port addition:
// StageMgr loads this after stages.cfg, stages_nightsdlc.cfg, stages_dualshot.cfg and stages_extreme.cfg. Backgrounds
// (levels/pc/), level art (images/pc/) and the thumbnail sheet come from tools/import_bonus_levels.py.
// Dialogue from references/PeggleWoW/levels/stages.cfg. It has no credits, so a win goes back to
// the main menu. Stage 1's tutorial dialogs lose the PC's leading blank lines (room for its tutorial
// pictures; this version draws its own icons beside the text). Its Tip lines are left out.
// StageDialog 2 and 3 are the story screen's two parts; 4 and 5, where a stage has them, replace
// them once the adventure has been beaten.

// 1. Bjorn
Stage
{
	Level: hogger, "Wanted: Hogger", 300000
	Level: storm, "Valley of Heroes", 350000
	Level: onyx, "Deep Breath", 325000
	Level: rag, "Too Soon, Executus", 350000
	Level: darkportal, "The Dark Portal", 325000

	Dialog: 1,"Hit all ^ff8800^ORANGE PEGS^oldclr^ to WIN!\n\nYou have ^00FF00^10 SHOTS.^oldclr^","Instructions"
	Dialog: 2,"^00FF00^Green pegs^oldclr^ activate ^00ff00^MAGIC POWERS!^oldclr^\n\nThe first Magic Power is ^00ff00^SUPER GUIDE!^oldclr^\nIt lasts for the next three turns!","Magic Peg!"
	Dialog: 3,"The ^FF66FF^PURPLE PEG^oldclr^ is worth big points!\n\nScore over ^FF66FF^25,000^oldclr^ points on\na shot to get a ^00ff00^Free Ball!^oldclr^","Purple Point Peg"
	Dialog: 4,"I'm not sure Ragnaros would make a good Peggle Master. Too fiery a temper!","Hot Enough?"
	Dialog: 5,"What wonderous wonders lie behind this portal? Let's find out!","Portastic"

	StageDialog: 1, "^22FFFF^Headmaster Bjorn^oldclr^\n"
	StageDialog: 1, "^BBFFFF^Level 80 Unicorn^oldclr^\n"

	StageDialog: 2, "\nThere are many sights to see in Azeroth. New people and places to visit. I'm very excited. I even got myself some awesome armor to fit in. According to local tradition however, we need to have a quest in order to go do things."
	StageDialog: 3, "\nSo here is your quest, Adventurer. Go forth and dispatch five mighty Peggle levels and bring me proof of your extreme fever awesome. Only then will we be able to access... the next five Peggle levels. And then some challenges after that."
}

