// Peggle Extreme (PC) levels, shown on their own Quick Play page after the Nights bonus page, and
// played as their own Adventure (Select Game > More). Port addition: StageMgr loads this after
// stages.cfg and stages_nightsdlc.cfg. Backgrounds (levels/pc/) and the thumbnail sheet come from
// tools/import_bonus_levels.py.
// Dialogue from references/PeggleExtreme/levels/stages.cfg. Stage 1's tutorial dialogs lose the
// PC's leading blank lines (room for its tutorial pictures; this version draws its own icons beside
// the text), and level 5's aiming text is this version's own. Its Tip lines are left out.

// 1.
Stage
{
	Level: vortogon, "Vortigaunt"
	Level: hunter, "Hunter"
	Level: headcrab, "Surprise!"
	Level: toasty, "Toasty"
	Level: bjornnheavy, "Dynamic Duo"

	Dialog: 1,"Hit all ^ff8800^ORANGE PEGS^oldclr^ to WIN!\n\nYou have ^00FF00^10 SHOTS.^oldclr^","Instructions"
	Dialog: 2,"This level has ^00FF00^BRICKS!^oldclr^\n\nClear the ^ff8800^ORANGE BRICKS^oldclr^ and\n^ff8800^ORANGE PEGS^oldclr^ to pass the level.","Hit the Bricks"
	Dialog: 3,"^00FF00^Green pegs^oldclr^ activate ^00ff00^MAGIC POWERS!^oldclr^\n\nThe first Magic Power is ^00ff00^SUPER GUIDE!^oldclr^\nIt lasts for the next three turns!","Magic Peg!"
	Dialog: 4,"The ^FF66FF^PURPLE PEG^oldclr^ is worth big points!\n\nScore over ^FF66FF^25,000^oldclr^ points on\na shot to get a ^00ff00^Free Ball!^oldclr^","Purple Point Peg"
	Dialog: 5,"The ball will follow ^00ff00^the guide.^oldclr^\n\nYou can aim your shot with the ^00ff00^scroll wheel^oldclr^ or ^00ff00^by touching the screen.^oldclr^","Aiming"

	StageDialog: 1, "^22FFFF^All Points Peggle Bulletin^oldclr^\n"
	StageDialog: 1, "^BBFFFF^Master: Bjorn Unicorn^oldclr^\n"

	StageDialog: 2, "Alert! Mayday! This is Bjorn, founder of the Peggle Institute, broadcasting on all frequencies!\n\n"
	StageDialog: 2, "Nightmarish creatures have invaded the Institute. All able-bodied Peggle Masters are to report for duty.\n\n"
	StageDialog: 2, "With our skills we'll bounce them out of here in no time!"
}

