	Dialog: 3,"These dratted portals complicate matters considerably!\n\nUse my ^00ff00^Super Guide^oldclr^ to navigate them!","Double Trouble"
	Dialog: 4,"The portals are multiplying at a geometric rate!\n\nChoose your shots carefully and pay attention to your timing!","So Many Portals"
