// The Peggle web demo's own levels (popcap.com, references/PeggleWebDemo), shown on the Peggle Quick
// Play page under Peggle's stages as "Demo Levels", always open. Port addition: StageMgr loads this
// after the other bonus configs (BonusPage.mOnPeggleRows: it has no page of its own).
// The demo's 8 other levels (pinwheels, spinners, tri, level10web, backspiral, level14web,
// level15web, beans) were reused for the Nights DLC "Spring Fever" packs (stages_nightsdlc.cfg), so
// they aren't repeated here. Levels in the demo's order, named "Demo 1"-"Demo 14" (the demo reused
// the full game's level names, and shipped three as "AAA", "BBB" and "CCC"). Backgrounds and thumbnails: tools/import_webdemo_levels.py.

// 1.
Stage
{
	Level: funnel, "Demo 1"
	Level: bowl, "Demo 2"
	Level: slides, "Demo 3"
	Level: scary, "Demo 4"
	Level: level13web, "Demo 5"
}

// 2.
Stage
{
	Level: level19aweb, "Demo 6"
	Level: level17web, "Demo 7"
	Level: bricks, "Demo 8"
	Level: sonofowl, "Demo 9"
	Level: doublebucket, "Demo 10"
}

// 3.
Stage
{
	Level: wiggles, "Demo 11"
	Level: level12web, "Demo 12"
	Level: level16web, "Demo 13"
	Level: level18web, "Demo 14"
}
