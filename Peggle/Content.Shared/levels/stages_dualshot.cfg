// Peggle Dual Shot (Nintendo DS) exclusive levels, shown on their own Quick Play page after the
// Nights bonus page. They play as Peggle levels and are always open. Port addition: StageMgr loads
// this after stages.cfg and stages_nightsdlc.cfg. The levels, backgrounds and thumbnails come from the DS
// game (tools/import_dualshot_levels.py: levels/qstage*.dat converted from its 16.16 fixed-point
// format, backgrounds levels/<res>/qstage*.jpg). Names from its message_en.bin ("Q1: Flamingo
// Sqall" ... "Q10: Bubbbbbbbbllle"), without the "Qn: " prefix; the DS spelling is kept. The DS
// game has no ace scores, so every level uses 350,000.

// 1. Q1-Q5
Stage
{
	Level: qstage01, "Q1: Flamingo Sqall", 350000
	Level: qstage02, "Q2: Magician Girl", 350000
	Level: qstage03, "Q3: Roar of the Ancient", 350000
	Level: qstage04, "Q4: Egyptian Treasure", 350000
	Level: qstage05, "Q5: Garden Dewdrop", 350000
}

// 2. Q6-Q10
Stage
{
	Level: qstage06, "Q6: Home Sweet Bjorn", 350000
	Level: qstage07, "Q7: SATORI", 350000
	Level: qstage08, "Q8: Alien Attack!", 350000
	Level: qstage09, "Q9: yhtapeleT", 350000
	Level: qstage10, "Q10: Bubbbbbbbbllle", 350000
}
